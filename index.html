<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagos Carro — Pablo</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--surface:#111118;--card:#16161f;--border:#22222e;--accent:#7c5cfc;--accent2:#00e5a0;--warn:#ff6b35;--text:#e8e8f0;--muted:#6b6b80;--paid:#00e5a0;--partial:#f5a623;--pending:#ff4757;--r:14px;--rs:8px;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(124,92,252,.03)1px,transparent 1px),linear-gradient(90deg,rgba(124,92,252,.03)1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}

  header{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px;}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.05em;display:flex;align-items:center;gap:10px;}
  .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.7)}}
  #adminToggleBtn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.15rem;padding:6px 8px;border-radius:6px;transition:all .2s;opacity:.18;}
  #adminToggleBtn:hover,#adminToggleBtn.active{color:var(--accent);opacity:1;}

  main{position:relative;z-index:1;padding:24px 16px 80px;max-width:920px;margin:0 auto;}

  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;}
  .sum-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 14px;transition:transform .2s,border-color .2s;}
  .sum-card:hover{transform:translateY(-2px);border-color:var(--accent);}
  .sum-label{font-size:.58rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:6px;}
  .sum-value{font-family:'Syne',sans-serif;font-weight:700;font-size:1.15rem;}
  .cv-green{color:var(--paid)}.cv-red{color:var(--pending)}.cv-orange{color:var(--partial)}.cv-purple{color:var(--accent)}

  .progress-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:20px;}
  .progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .progress-title{font-family:'Syne',sans-serif;font-weight:700;font-size:.85rem;}
  .progress-pct{font-size:.8rem;color:var(--accent2);font-weight:500;}
  .progress-bar-bg{background:var(--border);border-radius:99px;height:10px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .8s ease;}

  .all-years-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:20px;}
  .year-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;transition:all .2s;cursor:pointer;}
  .year-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .year-card-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;color:var(--accent);margin-bottom:10px;}
  .year-mini-row{display:flex;justify-content:space-between;margin-bottom:4px;font-size:.68rem;}
  .year-mini-bar{height:4px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:8px;}
  .year-mini-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));}

  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{font-family:'Syne',sans-serif;font-weight:600;font-size:.78rem;padding:7px 20px;border-radius:99px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .2s;}
  .tab:hover{border-color:var(--accent);color:var(--text);}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .table-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border);}
  table{width:100%;border-collapse:collapse;}
  thead tr th{font-size:.58rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:500;padding:11px 14px;text-align:left;border-bottom:1px solid var(--border);background:var(--surface);white-space:nowrap;}
  tbody tr{border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s;}
  tbody tr:hover{background:rgba(124,92,252,.06);}
  tbody tr td{padding:12px 14px;font-size:.76rem;vertical-align:middle;}
  td.mes-col{font-family:'Syne',sans-serif;font-weight:600;font-size:.8rem;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  td.num.green{color:var(--paid);}td.num.red{color:var(--pending);}
  .badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.58rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;}
  .badge-paid{background:rgba(0,229,160,.12);color:var(--paid);border:1px solid rgba(0,229,160,.25);}
  .badge-partial{background:rgba(245,166,35,.12);color:var(--partial);border:1px solid rgba(245,166,35,.25);}
  .badge-pending{background:rgba(255,71,87,.12);color:var(--pending);border:1px solid rgba(255,71,87,.25);}
  .pagos-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--muted);font-size:.7rem;transition:all .2s;white-space:nowrap;}
  .pagos-btn:hover,.pagos-btn.has-data{border-color:var(--accent2);color:var(--accent2);}
  .total-row td{font-family:'Syne',sans-serif;font-weight:700;border-top:2px solid var(--border);background:rgba(124,92,252,.08);font-size:.78rem;}

  .year-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);}
  .ys-item{flex:1;min-width:90px;}
  .ys-label{font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:3px;}
  .ys-val{font-family:'Syne',sans-serif;font-weight:700;font-size:.88rem;}

  /* ══ ADMIN OVERLAY ══ */
  #adminPanel{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);overflow-y:auto;}
  #adminPanel.open{display:flex;justify-content:center;align-items:flex-start;padding:28px 14px 60px;}
  .admin-box{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);width:100%;max-width:560px;box-shadow:0 0 60px rgba(124,92,252,.2);overflow:hidden;animation:slideUp .3s ease;}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .admin-header{background:linear-gradient(135deg,rgba(124,92,252,.15),rgba(0,229,160,.07));border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;}
  .admin-title{font-family:'Syne',sans-serif;font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:8px;}
  #closeAdmin{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.2rem;padding:4px;transition:color .2s;}
  #closeAdmin:hover{color:var(--text);}
  .admin-body{padding:18px 20px;}

  .field{margin-bottom:13px;}
  .field label{display:block;font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:5px;}
  .field input,.field select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;color:var(--text);font-family:'DM Mono',monospace;font-size:.8rem;outline:none;transition:border-color .2s;}
  .field input[type="date"]{color-scheme:dark;cursor:pointer;}
  .field input:focus,.field select:focus{border-color:var(--accent);}
  .btn-primary{width:100%;padding:11px;background:var(--accent);border:none;border-radius:var(--rs);color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:.82rem;letter-spacing:.05em;cursor:pointer;transition:opacity .2s;}
  .btn-primary:hover{opacity:.85;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .err-msg{color:var(--pending);font-size:.7rem;margin-top:7px;display:none;}

  .edit-tabs{display:flex;gap:6px;margin-bottom:16px;}
  .edit-tab{font-size:.68rem;padding:5px 14px;border-radius:99px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .2s;font-family:'DM Mono',monospace;}
  .edit-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .edit-pane{display:none;}
  .edit-pane.active{display:block;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* ABONO CARD */
  .abono-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:12px;margin-bottom:10px;}
  .abono-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .abono-num{font-family:'Syne',sans-serif;font-weight:700;font-size:.72rem;color:var(--accent);}
  .remove-abono{background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.2);border-radius:5px;cursor:pointer;color:var(--pending);font-size:.72rem;padding:3px 8px;transition:all .2s;}
  .remove-abono:hover{background:rgba(255,71,87,.25);}
  .abono-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}

  /* foto per abono */
  .foto-row{display:flex;align-items:center;gap:8px;border:1px dashed var(--border);border-radius:6px;padding:7px 10px;cursor:pointer;transition:border-color .2s;}
  .foto-row:hover{border-color:var(--accent2);}
  .foto-row.loaded{border-color:var(--accent2);}
  .foto-thumb{width:34px;height:34px;border-radius:4px;object-fit:cover;display:none;}
  .foto-icon{font-size:1.1rem;flex-shrink:0;}
  .foto-label{font-size:.63rem;color:var(--muted);flex:1;}
  .foto-label.loaded{color:var(--accent2);}
  .foto-del{background:none;border:none;cursor:pointer;color:var(--pending);font-size:.8rem;padding:2px 5px;display:none;}

  .add-abono-btn{display:flex;align-items:center;gap:6px;justify-content:center;background:none;border:1px dashed var(--border);border-radius:var(--rs);padding:9px;color:var(--muted);font-family:'DM Mono',monospace;font-size:.72rem;cursor:pointer;transition:all .2s;width:100%;margin-bottom:14px;}
  .add-abono-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* sync status */
  .sync-bar{display:flex;align-items:center;gap:8px;font-size:.68rem;color:var(--muted);padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:14px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;}
  .sync-dot.ok{background:var(--paid);box-shadow:0 0 6px var(--paid);}
  .sync-dot.err{background:var(--pending);}
  .sync-dot.loading{background:var(--partial);animation:pulse 1s infinite;}

  /* LIGHTBOX */
  #photoModal{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.96);backdrop-filter:blur(14px);flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:zoom-out;}
  #photoModal.open{display:flex;}
  #photoModal img{max-width:94vw;max-height:84vh;border-radius:10px;}
  #photoModalCaption{font-size:.7rem;color:var(--muted);}
  .modal-x{position:fixed;top:14px;right:14px;background:var(--card);border:1px solid var(--border);border-radius:99px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);font-size:.8rem;}

  /* TOAST */
  #toast{position:fixed;bottom:22px;right:22px;z-index:500;background:var(--card);border:1px solid var(--accent2);border-radius:var(--rs);padding:10px 16px;font-size:.74rem;color:var(--accent2);transform:translateY(70px);opacity:0;transition:all .3s;pointer-events:none;max-width:260px;}
  #toast.show{transform:translateY(0);opacity:1;}
  #toast.err-toast{border-color:var(--pending);color:var(--pending);}

  .btn-actions{display:flex;gap:8px;margin-top:6px;}
  .btn-save{flex:2;}
  .btn-secondary{flex:1;padding:11px;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);color:var(--muted);font-family:'DM Mono',monospace;font-size:.74rem;cursor:pointer;transition:all .2s;}
  .btn-secondary:hover{border-color:var(--accent);color:var(--accent);}

  @media(max-width:480px){
    main{padding:14px 10px 80px;}
    .summary-grid{grid-template-columns:1fr 1fr;}
    .abono-row{grid-template-columns:1fr 1fr;}
    .row2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>PAGOS CARRO</div>
  <button id="adminToggleBtn" title="Admin" onclick="openAdminPanel()">⚙</button>
</header>

<main>
  <div class="summary-grid" id="summaryCards"></div>
  <div class="progress-wrap">
    <div class="progress-header">
      <span class="progress-title">Progreso total 2023–2026</span>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <div class="all-years-grid" id="allYearsGrid"></div>
  <div class="tabs" id="yearTabs"></div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Mes</th><th class="num">Monto</th>
        <th class="num">Abonado</th><th class="num">Saldo</th>
        <th>Estado</th><th>Detalle</th>
      </tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="year-stats" id="yearStats"></div>
</main>

<!-- ADMIN PANEL -->
<div id="adminPanel">
  <div class="admin-box">
    <div class="admin-header">
      <div class="admin-title">🔐 Panel Administrador</div>
      <button id="closeAdmin" onclick="closeAdminPanel()">✕</button>
    </div>
    <div class="admin-body">

      <!-- LOGIN -->
      <div id="loginSection">
        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="adminPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <button class="btn-primary" onclick="doLogin()">Entrar</button>
        <div class="err-msg" id="loginErr">Contraseña incorrecta</div>
      </div>

      <!-- EDIT -->
      <div id="editSection" style="display:none;">

        <!-- sync status -->
        <div class="sync-bar" id="syncBar">
          <div class="sync-dot" id="syncDot"></div>
          <span id="syncMsg">Listo para sincronizar</span>
        </div>

        <div class="edit-tabs">
          <button class="edit-tab active" onclick="switchEditTab('pagos',this)">Pagos</button>
          <button class="edit-tab" onclick="switchEditTab('config',this)">Montos</button>
          <button class="edit-tab" onclick="switchEditTab('settings',this)">GitHub</button>
        </div>

        <!-- PANE PAGOS -->
        <div class="edit-pane active" id="pane-pagos">
          <div class="row2" style="margin-bottom:14px;">
            <div class="field" style="margin:0;">
              <label>Año</label>
              <select id="editYear" onchange="loadEditMonth()">
                <option>2023</option><option>2024</option><option>2025</option><option selected>2026</option>
              </select>
            </div>
            <div class="field" style="margin:0;">
              <label>Mes</label>
              <select id="editMonth" onchange="refreshAbonos()"></select>
            </div>
          </div>
          <div id="abonosContainer"></div>
          <button class="add-abono-btn" onclick="addAbonoCard()">＋ Agregar pago</button>
          <div class="btn-actions">
            <button class="btn-primary btn-save" id="saveBtn" onclick="saveAndSync()">💾 Guardar y publicar</button>
            <button class="btn-secondary" onclick="closeAdminPanel()">Cancelar</button>
          </div>
        </div>

        <!-- PANE CONFIG -->
        <div class="edit-pane" id="pane-config">
          <p style="font-size:.7rem;color:var(--muted);margin-bottom:14px;">Monto mensual esperado por período.</p>
          <div id="configFields"></div>
          <button class="btn-primary" onclick="saveConfigAndSync()">💾 Guardar y publicar</button>
        </div>

        <!-- PANE GITHUB SETTINGS -->
        <div class="edit-pane" id="pane-settings">
          <p style="font-size:.7rem;color:var(--muted);margin-bottom:14px;">Token de GitHub para sincronizar cambios en tiempo real. Se guarda solo en este dispositivo.</p>
          <div class="field">
            <label>GitHub Token (ghp_...)</label>
            <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">
          </div>
          <div class="field">
            <label>Repositorio</label>
            <input type="text" id="ghRepo" value="Paulanguloc/Pagos" placeholder="usuario/repo">
          </div>
          <div class="field">
            <label>Archivo</label>
            <input type="text" id="ghFile" value="index.html" placeholder="index.html">
          </div>
          <button class="btn-primary" onclick="saveGHSettings()">Guardar configuración</button>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="photoModal" onclick="closePhoto()">
  <div class="modal-x">✕</div>
  <img id="photoModalImg" src="" alt="">
  <div id="photoModalCaption"></div>
</div>

<div id="toast"></div>

<script>

//  HELPERS
// ══════════════════════════════════════════
function fmt(n){return '₡'+n.toLocaleString('es-CR');}
function fmtFecha(iso){
  if(!iso)return '—';
  const [y,m,d]=iso.split('-');
  return d+'/'+m+'/'+y;
}
function getMonto(year,idx){
  const c=APP_DATA.config.montos;
  if(year==2023)return c['2023'];
  if(year==2024)return c['2024'];
  if(year==2025)return idx<7?c['2025_ene_jul']:c['2025_ago_dic'];
  return c['2026'];
}
function calcRow(year,idx){
  const row=APP_DATA.pagos[year][idx];
  const monto=getMonto(year,idx);
  const abonado=row.abonos.reduce((s,a)=>s+(+a.monto||0),0);
  const saldo=Math.max(0,monto-abonado);
  let estado='Pendiente';
  if(abonado>=monto)estado='Pagado';
  else if(abonado>0)estado='Parcial';
  return{mes:row.mes,monto,abonado,saldo,estado};
}

      '<td class="mes-col">'+c.mes+'</td>'+

      '<td class="num green">'+(c.abonado>0?fmt(c.abonado):'—')+'</td>'+
      '<td class="num'+(c.saldo>0?' red':'')+'">'+( c.saldo>0?fmt(c.saldo):'✓')+'</td>'+

      '<td><button class="'+btnClass+'" onclick="showDetalle('+year+','+i+')">'+btnLabel+'</button></td>'+
    '</tr>';
  });

    '<div class="ys-item"><div class="ys-label">Facturado</div><div class="ys-val cv-purple">'+fmt(tM)+'</div></div>'+
    '<div class="ys-item"><div class="ys-label">Cancelado</div><div class="ys-val cv-green">'+fmt(tA)+'</div></div>'+
    '<div class="ys-item"><div class="ys-label">Pendiente</div><div class="ys-val cv-red">'+fmt(tS)+'</div></div>'+
    '<div class="ys-item"><div class="ys-label">% Pagado</div><div class="ys-val cv-orange">'+pct+'%</div></div>';

function refreshAbonos(){

  row.abonos.forEach(function(ab,ai){c.appendChild(makeAbonoCard(ab,ai));});

function makeAbonoCard(ab,idx){
  var d=document.createElement('div');
  d.className='abono-card';
  var hasFoto=!!(ab&&ab.foto);
  d.innerHTML=
    '<div class="abono-card-header">'+
      '<span class="abono-num">Pago '+(idx+1)+'</span>'+
      '<button class="remove-abono" onclick="this.closest(\'.abono-card\').remove();renumberAbonos()">✕ Eliminar</button>'+
    '</div>'+
    '<div class="abono-row">'+
      '<div class="field" style="margin:0;"><label>Monto ₡</label><input type="number" class="ab-monto" value="'+(ab&&ab.monto||'')+'" placeholder="25000"></div>'+
      '<div class="field" style="margin:0;"><label>Fecha</label><input type="date" class="ab-fecha" value="'+(ab&&ab.fecha||'')+'"></div>'+
    '</div>'+
    '<div class="foto-row'+(hasFoto?' loaded':'')+'" onclick="triggerFotoUpload(this)">'+
      '<span class="foto-icon">📎</span>'+
      '<span class="foto-label'+(hasFoto?' loaded':'')+'">'+(hasFoto?'Comprobante adjunto':'Toca para subir comprobante')+'</span>'+
      (hasFoto?'<img class="foto-thumb" src="'+(ab.foto)+'" style="display:block">':'')+
      '<button class="foto-del'+(hasFoto?' show':'')+'" onclick="event.stopPropagation();clearFoto(this)" style="'+(hasFoto?'display:inline':'display:none')+'">🗑</button>'+
    '</div>'+
    '<input type="file" accept="image/*" class="ab-foto-input" style="display:none;" onchange="handleFotoUpload(event,this)">'+
    '<input type="hidden" class="ab-foto-data" value="'+(ab&&ab.foto?ab.foto.replace(/"/g,'&quot;'):'')+'">';
  return d;
}

function renumberAbonos(){
  document.querySelectorAll('#abonosContainer .abono-card').forEach(function(c,i){
    var h=c.querySelector('.abono-num');
    if(h)h.textContent='Pago '+(i+1);
  });
}

function addAbonoCard(){
  var c=document.getElementById('abonosContainer');
  var idx=c.children.length;
  c.appendChild(makeAbonoCard({monto:'',fecha:'',foto:''},idx));
}

function triggerFotoUpload(fotoRow){
  fotoRow.closest('.abono-card').querySelector('.ab-foto-input').click();
}

function handleFotoUpload(e,inp){
  var file=e.target.files[0]; if(!file)return;
  var card=inp.closest('.abono-card');
  var reader=new FileReader();
  reader.onload=function(ev){
    var src=ev.target.result;
    card.querySelector('.ab-foto-data').value=src;
    var row=card.querySelector('.foto-row');
    row.classList.add('loaded');
    card.querySelector('.foto-label').textContent='Comprobante listo';
    card.querySelector('.foto-label').classList.add('loaded');
    var thumb=card.querySelector('.foto-thumb');
    if(!thumb){thumb=document.createElement('img');thumb.className='foto-thumb';row.appendChild(thumb);}
    thumb.src=src;thumb.style.display='block';
    var del=card.querySelector('.foto-del');
    del.style.display='inline';
  };
  reader.readAsDataURL(file);
}

function clearFoto(btn){
  var card=btn.closest('.abono-card');
  card.querySelector('.ab-foto-data').value='';
  card.querySelector('.ab-foto-input').value='';
  var row=card.querySelector('.foto-row');
  row.classList.remove('loaded');
  card.querySelector('.foto-label').textContent='Toca para subir comprobante';
  card.querySelector('.foto-label').classList.remove('loaded');
  var thumb=card.querySelector('.foto-thumb');
  if(thumb){thumb.style.display='none';thumb.src='';}
  btn.style.display='none';
}

// collect abonos from UI
function collectAbonos(){
  var abonos=[];
  document.querySelectorAll('#abonosContainer .abono-card').forEach(function(card){
    var m=+card.querySelector('.ab-monto').value;
    var f=card.querySelector('.ab-fecha').value;
    var foto=card.querySelector('.ab-foto-data').value;
    if(m>0)abonos.push({monto:m,fecha:f,foto:foto});
  });
  return abonos;
}

// ══════════════════════════════════════════
//  GITHUB SYNC
// ══════════════════════════════════════════
function updateSyncBar(state,msg){
  var dot=document.getElementById('syncDot');
  var txt=document.getElementById('syncMsg');
  dot.className='sync-dot';
  if(state==='ok'){dot.classList.add('ok');txt.textContent=msg||'Publicado correctamente';}
  else if(state==='err'){dot.classList.add('err');txt.textContent=msg||'Error al publicar';}
  else if(state==='loading'){dot.classList.add('loading');txt.textContent=msg||'Publicando...';}
  else{txt.textContent=msg||'Listo para sincronizar';}
}

async function pushToGitHub(){
  var gh=getGH();
  if(!gh.token||!gh.repo||!gh.file){
    showToast('Configurá el token de GitHub primero','err');
    switchEditTab('settings',document.querySelectorAll('.edit-tab')[2]);
    return false;
  }
  updateSyncBar('loading','Publicando en GitHub...');
  document.getElementById('saveBtn').disabled=true;

  try{
    // 1. get current SHA
    var url='https://api.github.com/repos/'+gh.repo+'/contents/'+gh.file;
    var headers={'Authorization':'Bearer '+gh.token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'};
    var getRes=await fetch(url,{headers:headers});
    if(!getRes.ok)throw new Error('No se pudo leer el archivo ('+getRes.status+'). Verificá el token y el repo.');
    var getJson=await getRes.json();
    var sha=getJson.sha;

    // 2. build new HTML with updated APP_DATA
    var newContent=buildNewHTML();
    var encoded=btoa(unescape(encodeURIComponent(newContent)));

    // 3. push
    var putRes=await fetch(url,{
      method:'PUT',headers:headers,
      body:JSON.stringify({message:'Actualizar pagos '+new Date().toLocaleDateString('es-CR'),content:encoded,sha:sha})
    });
    if(!putRes.ok){var e=await putRes.json();throw new Error(e.message||'Error al guardar');}
    updateSyncBar('ok','✓ Publicado — GitHub Pages actualizado');
    showToast('✓ Cambios publicados en GitHub Pages');
    return true;
  }catch(err){
    updateSyncBar('err',err.message);
    showToast(err.message,'err');
    return false;
  }finally{
    document.getElementById('saveBtn').disabled=false;
  }
}

function buildNewHTML(){
  // Replace the APP_DATA block in the current HTML source
  var src=document.documentElement.outerHTML;
  var newDataStr='var APP_DATA = '+JSON.stringify(APP_DATA,null,2)+';';
  // replace between markers
  var start=src.indexOf('var APP_DATA = ');
  var end=src.indexOf('};',start)+2;
  if(start===-1||end===1)return src;
  return src.substring(0,start)+newDataStr+src.substring(end);
}

// ── Save pagos ──
